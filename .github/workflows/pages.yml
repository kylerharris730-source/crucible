name: Publish web build to Pages

# The page and the Windows release are deliberately NOT coupled. index.html
# links to /releases/latest/download/, which GitHub resolves to whichever
# release is newest at the moment someone clicks it -- so cutting a release
# never requires touching this workflow, and republishing the page never
# requires uploading another executable.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "build_web.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace a pending one rather than stack up behind it,
# but never cancel a deploy that is already partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # Tags, and enough history to count commits since one. The
          # default checkout is shallow with no tags at all, which makes
          # scripts/version.sh print "unknown" and the page show no
          # version -- the exact failure the version number exists to
          # rule out.
          fetch-depth: 0

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the browser game
        # Run through bash rather than chmod +x and then ./ -- the chmod is a
        # real file-mode change to a tracked file, which git reports as a
        # modification and which made the published build call itself dirty.
        run: bash build_web.sh

      - name: Confirm the artefacts exist
        # A Pages deploy that silently ships an index.html with no wasm beside
        # it looks like a successful publish and is a blank screen, so fail
        # here instead of there.
        run: |
          for f in web/index.html web/cinderlift.js web/cinderlift.wasm; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          ls -lh web/

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
