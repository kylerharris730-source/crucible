name: Publish web build to Pages

# The page plays the latest RELEASE, not the latest commit on main.
#
# It used to rebuild on every push to main, so the browser game ran whatever
# was committed that minute -- half-finished work included -- while the
# Download button beside it handed out the last release. Two different games
# under one version heading. Worse, since online play they have to be the
# SAME game: the network handshake refuses a peer with a different build id,
# so a browser running main could never join a desktop running the release.
# Built from the release tag, both carry that tag's commit as their id and
# cross-play simply works.
#
# So this runs when "Publish Windows release" finishes successfully, and
# builds the tag that release was made from. A release that failed to publish
# never reaches the page. Run it by hand to republish the newest release --
# never main. The page, the wiki and the game therefore all change together,
# at release time; a fix to the wiki waits for the next release like any
# other change.
on:
  workflow_run:
    workflows: ["Publish Windows release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued run should replace a pending one rather than stack up behind it,
# but never cancel a deploy that is already partway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A failed or cancelled release run also fires workflow_run; only a
    # successful one means there is a release to show.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Find the release to publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          # For a run triggered by a tag push, head_branch is the tag's name.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="$RUN_TAG"
          else
            tag=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          case "$tag" in
            v*) ;;
            *) echo "not a release tag: '$tag'" >&2; exit 1 ;;
          esac
          echo "Publishing $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the release
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          # Tags, and enough history to count commits since one. The
          # default checkout is shallow with no tags at all, which makes
          # scripts/version.sh print "unknown" and the page show no
          # version -- the exact failure the version number exists to
          # rule out.
          fetch-depth: 0

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Build the browser game
        # Run through bash rather than chmod +x and then ./ -- the chmod is a
        # real file-mode change to a tracked file, which git reports as a
        # modification and which made the published build call itself dirty.
        run: bash build_web.sh

      - name: Confirm the artefacts exist
        # A Pages deploy that silently ships an index.html with no wasm beside
        # it looks like a successful publish and is a blank screen, so fail
        # here instead of there.
        run: |
          for f in web/index.html web/cinderlift.js web/cinderlift.wasm; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          ls -lh web/

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
