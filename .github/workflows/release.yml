name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          # Tags, and enough history to count commits since one. The
          # default checkout is shallow with no tags at all, which makes
          # scripts/version.sh print "unknown" and the page show no
          # version -- the exact failure the version number exists to
          # rule out.
          fetch-depth: 0

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw --no-progress -y
          $roots = @('C:\ProgramData\mingw64', 'C:\tools\mingw64', 'C:\mingw64')
          $compiler = Get-ChildItem $roots -Filter g++.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $compiler) { throw 'Chocolatey installed MinGW but g++.exe was not found' }
          $compiler.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build game and launcher
        shell: cmd
        run: |
          call build.bat
          call build_launcher.bat

      - name: Reject non-Windows runtime DLL dependencies
        shell: powershell
        run: |
          $binaries = @('build/cinderlift.exe', 'build/cinderlift-launcher.exe')
          foreach ($binary in $binaries) {
            $imports = (& objdump -p $binary | Select-String 'DLL Name').Line
            $forbidden = $imports | Select-String -Pattern 'libwinpthread|libgcc|libstdc\+\+' -CaseSensitive:$false
            if ($forbidden) {
              throw "$binary depends on a MinGW runtime DLL:`n$($forbidden -join "`n")"
            }
          }

      - name: Create verified release manifest
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/cinderlift.exe release/cinderlift.exe
          Copy-Item build/cinderlift-launcher.exe release/cinderlift-launcher.exe
          ./scripts/make_release_manifest.ps1 `
            -Tag $env:RELEASE_TAG -Repository $env:REPOSITORY `
            -Game release/cinderlift.exe -Launcher release/cinderlift-launcher.exe `
            -Output release/cinderlift-manifest.txt

          # The same manifest under the name the game shipped as before the
          # rename to Cinderlift. This is not tidiness, it is the difference
          # between an old launcher updating itself and being bricked: every
          # launcher already installed has
          #   .../releases/latest/download/crucible-manifest.txt
          # COMPILED INTO IT, and cannot be told otherwise. Publish only the
          # new name and those launchers get a 404 forever -- and since the
          # replacement launcher is delivered through the manifest they can no
          # longer fetch, they can never recover on their own.
          #
          # The copy fixes that without any special case. Its game_url and
          # launcher_url point at the NEW cinderlift-* assets, so an old
          # launcher reads the old filename, downloads the new binaries, and
          # replaces itself with the new launcher -- which then uses the new
          # manifest name from that point on. One quiet self-healing hop.
          #
          # Safe to delete once no installed launcher predates the rename.
          Copy-Item release/cinderlift-manifest.txt release/crucible-manifest.txt

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release/cinderlift.exe `
            release/cinderlift-launcher.exe `
            release/cinderlift-manifest.txt `
            release/crucible-manifest.txt `
            --verify-tag --generate-notes --title "Cinderlift ${{ github.ref_name }}"
