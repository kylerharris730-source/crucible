name: Publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Install MinGW
        shell: powershell
        run: |
          choco install mingw --no-progress -y
          $roots = @('C:\ProgramData\mingw64', 'C:\tools\mingw64', 'C:\mingw64')
          $compiler = Get-ChildItem $roots -Filter g++.exe -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $compiler) { throw 'Chocolatey installed MinGW but g++.exe was not found' }
          $compiler.Directory.FullName | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build game and launcher
        shell: cmd
        run: |
          call build.bat
          call build_launcher.bat

      - name: Reject non-Windows runtime DLL dependencies
        shell: powershell
        run: |
          $binaries = @('build/crucible.exe', 'build/crucible-launcher.exe')
          foreach ($binary in $binaries) {
            $imports = (& objdump -p $binary | Select-String 'DLL Name').Line
            $forbidden = $imports | Select-String -Pattern 'libwinpthread|libgcc|libstdc\+\+' -CaseSensitive:$false
            if ($forbidden) {
              throw "$binary depends on a MinGW runtime DLL:`n$($forbidden -join "`n")"
            }
          }

      - name: Create verified release manifest
        shell: powershell
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item build/crucible.exe release/crucible.exe
          Copy-Item build/crucible-launcher.exe release/crucible-launcher.exe
          ./scripts/make_release_manifest.ps1 `
            -Tag $env:RELEASE_TAG -Repository $env:REPOSITORY `
            -Game release/crucible.exe -Launcher release/crucible-launcher.exe `
            -Output release/crucible-manifest.txt

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release/crucible.exe `
            release/crucible-launcher.exe `
            release/crucible-manifest.txt `
            --verify-tag --generate-notes --title "Crucible ${{ github.ref_name }}"
